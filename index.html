<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Um recadinho pra você</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0a08;
        --bg-deep: #070504;
        --card: #171009;
        --line: rgba(232, 178, 106, 0.28);
        --gold: #e8b26a;
        --ember: #e2713a;
        --text: #f3e9dc;
        --muted: #b9a68f;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background:
          radial-gradient(ellipse 90% 55% at 50% 108%, rgba(226, 113, 58, 0.22), transparent 65%),
          radial-gradient(ellipse 70% 40% at 50% -8%, rgba(232, 178, 106, 0.10), transparent 70%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
        color: var(--text);
        font-family: "Jost", system-ui, sans-serif;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 20px calc(28px + env(safe-area-inset-bottom));
      }
      .card {
        width: 100%;
        max-width: 430px;
        text-align: center;
        padding: 44px 30px 40px;
        background: linear-gradient(180deg, rgba(35, 24, 14, 0.72), rgba(20, 14, 9, 0.85));
        border: 1px solid var(--line);
        border-radius: 6px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      }
      .flame {
        font-size: 30px;
        line-height: 1;
        margin-bottom: 18px;
        filter: drop-shadow(0 0 14px rgba(226, 113, 58, 0.55));
      }
      h1 {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 600;
        font-size: clamp(30px, 8.4vw, 40px);
        line-height: 1.15;
        margin: 0 0 10px;
        letter-spacing: 0.01em;
      }
      .timer {
        font-size: 14px;
        font-weight: 400;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 30px;
        font-variant-numeric: tabular-nums;
      }
      .timer span { color: var(--gold); }
      .divider {
        width: 56px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
        margin: 0 auto 30px;
      }
      .song-name {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(23px, 6.4vw, 28px);
        font-weight: 600;
        margin: 0 0 4px;
      }
      .song-note {
        color: var(--muted);
        font-size: 14.5px;
        font-weight: 300;
        letter-spacing: 0.06em;
        margin: 0 0 22px;
      }
      .listen {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: linear-gradient(135deg, #e2713a, #c94f1e);
        color: #fff7ee;
        text-decoration: none;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.04em;
        padding: 14px 30px;
        border-radius: 999px;
        box-shadow: 0 10px 28px rgba(226, 113, 58, 0.35);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .listen:active { transform: scale(0.97); }
      blockquote {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-style: italic;
        font-weight: 500;
        font-size: clamp(22px, 6.2vw, 27px);
        line-height: 1.45;
        color: var(--gold);
        margin: 36px 4px 30px;
      }
      .closing {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(24px, 6.6vw, 29px);
        font-weight: 600;
        margin: 0;
      }
      .gone {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(26px, 7vw, 32px);
        font-weight: 600;
        margin: 0;
        padding: 30px 0 22px;
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main class="card">
      <div id="content">
        <div class="flame" aria-hidden="true">🔥</div>
        <h1>Um recadinho pra você 🎵</h1>
        <p class="timer">Some em <span id="countdown">20:00</span></p>
        <div class="divider"></div>

        <p class="song-name">Diggo — Fogo e Gasolina</p>
        <p class="song-note">Começa no 9:14</p>
        <a class="listen" href="https://www.youtube.com/watch?v=OJtw7LZrVdw" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72c0 .8.87 1.3 1.56.88l10.5-6.86a1.03 1.03 0 0 0 0-1.76L9.56 4.26A1.03 1.03 0 0 0 8 5.14z"/></svg>
          Ouvir a música
        </a>

        <blockquote>“Vai, amor, então fala que tu é minha... nós dois juntos é fogo e gasolina.”</blockquote>

        <p class="closing">Bom dia Cheirinho 😏</p>
      </div>

      <p class="gone" id="gone" hidden>Este recado já sumiu ✨</p>
    </main>

    <script>
      (function () {
        var KEY = "recado_ana_primeira_abertura";
        var DURATION = 20 * 60 * 1000; // 20 minutos
        var start = null;

        try {
          var saved = window.localStorage.getItem(KEY);
          if (saved) {
            start = parseInt(saved, 10);
            if (isNaN(start)) start = null;
          }
          if (start === null) {
            start = Date.now();
            window.localStorage.setItem(KEY, String(start));
          }
        } catch (e) {
          if (start === null) start = Date.now();
        }

        var countdownEl = document.getElementById("countdown");
        var contentEl = document.getElementById("content");
        var goneEl = document.getElementById("gone");
        var timerId = null;

        function pad(n) { return (n < 10 ? "0" : "") + n; }

        function expire() {
          if (timerId !== null) { clearInterval(timerId); timerId = null; }
          contentEl.hidden = true;
          goneEl.hidden = false;
        }

        function tick() {
          var remaining = DURATION - (Date.now() - start);
          if (remaining <= 0) {
            expire();
            return;
          }
          var totalSeconds = Math.ceil(remaining / 1000);
          var minutes = Math.floor(totalSeconds / 60);
          var seconds = totalSeconds % 60;
          countdownEl.textContent = pad(minutes) + ":" + pad(seconds);
        }

        tick();
        if (!goneEl.hidden) return;
        if (DURATION - (Date.now() - start) > 0) {
          timerId = setInterval(tick, 250);
        }
      })();
    </script>
  </body>
</html>
